<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <title>Relatório de Estoque</title>
  <style>
    @page {
      size: A4;
      margin: 1.5cm;

      @bottom-right {
        content: "Página " counter(page) " de " counter(pages);
        font-family: Helvetica, Arial, sans-serif;
        font-size: 9px;
        color: #888888;
      }
    }

    body {
      font-family: Helvetica, Arial, sans-serif;
      font-size: 11px;
    }

    h1 {
      color: #1f3864;
      text-align: center;
      margin-bottom: 0;
    }

    .subtitulo {
      color: #888888;
      text-align: center;
      margin-bottom: 20px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th {
      background-color: #1f3864;
      color: #ffffff;
      text-align: left;
      padding: 6px;
    }

    td {
      border: 1px solid #cccccc;
      padding: 6px;
    }

    tr:nth-child(even) td {
      background-color: #f2f2f2;
    }

    .numero {
      text-align: right;
    }

    .total {
      text-align: right;
      font-weight: bold;
      font-size: 13px;
      margin-top: 10px;
    }
  </style>
</head>
<body>

<h1>Relatório de Estoque</h1>
<p class="subtitulo" th:text="'Gerado em ' + ${#temporals.format(dataGeracao, 'dd/MM/yyyy')}">
  Gerado em 01/01/2025
</p>

<table>
  <thead>
  <tr>
    <th>ID</th>
    <th>Produto</th>
    <th>Categoria</th>
    <th class="numero">Qtd.</th>
    <th class="numero">Preço unit.</th>
    <th class="numero">Total</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="produto : ${produtos}">
    <td th:text="${produto.id}">1</td>
    <td th:text="${produto.nome}">Produto de exemplo</td>
    <td th:text="${produto.categoria}">Categoria</td>
    <td class="numero" th:text="${produto.quantidade}">10</td>
    <td class="numero"
        th:text="'R$ ' + ${#numbers.formatDecimal(produto.precoUnitario, 1, 'POINT', 2, 'COMMA')}">
      R$ 0,00
    </td>
    <td class="numero"
        th:text="'R$ ' + ${#numbers.formatDecimal(produto.valorTotal, 1, 'POINT', 2, 'COMMA')}">
      R$ 0,00
    </td>
  </tr>
  </tbody>
</table>

<p class="total"
   th:text="'Valor total em estoque: R$ ' + ${#numbers.formatDecimal(valorTotal, 1, 'POINT', 2, 'COMMA')}">
  Valor total em estoque: R$ 0,00
</p>

</body>
</html>
